name: release

# A `v*` tag builds Linux and macOS binaries on native runners, tests them and publishes a
# GitHub Release with SHA256SUMS and build provenance. `deploy/upgrade.sh` installs it.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: aarch64
            os: linux
            runner: ubuntu-24.04-arm
          - arch: x86_64
            os: linux
            runner: ubuntu-24.04
          - arch: aarch64
            os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
      OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag matches Cargo.toml and is on main
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml $version" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main" >&2; exit 1; }
      - name: Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
          rustup default 1.100.0
      - name: Gate
        run: ./scripts/check.sh
      - name: Database gate
        run: ./scripts/check-database.sh
      - name: Release build
        run: cargo build --locked --release
      - name: Protocol suites against the release binary
        env:
          BRAINKEEP_BINARY: ${{ github.workspace }}/target/release/brainkeep
        run: |
          for t in protocol http_protocol oauth_protocol panel_protocol panel_google_protocol panel_live_protocol \
            panel_edit_protocol panel_archive_protocol panel_activity_protocol panel_admin_protocol; do
            python3 "tests/$t.py"
          done
      - name: Package
        run: |
          name="brainkeep-${GITHUB_REF_NAME#v}-$ARCH-$OS"
          # GNU tar for reproducible archives; macOS runners ship it as gtar.
          if tar --version 2>/dev/null | grep -q 'GNU tar'; then gnutar=tar; else gnutar=gtar; fi
          command -v "$gnutar" >/dev/null || { echo 'GNU tar not found' >&2; exit 1; }
          mkdir -p "dist/$name"
          cp target/release/brainkeep LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          cp -R deploy tests "dist/$name/"
          find "dist/$name" -name __pycache__ -prune -exec rm -rf {} +
          # Same commit, same bytes: fixed mtime, owners and order; gzip without a timestamp.
          "$gnutar" -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" -cf - "$name" \
            | gzip -9n > "dist/$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brainkeep-${{ matrix.arch }}-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: brainkeep-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
