[package]
name = "brainkeep"
version = "0.1.0"
edition = "2024"
description = "Shared, user-controlled memory for AI agents (MCP server)"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
rmcp = { version = "=3.10.0", features = ["transport-async-rw", "transport-streamable-http-server"] }
axum = "0.8"
subtle = "2.6"
sha2 = "0.11"
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "=0.42.0", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-std", "io-util", "signal", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
base64 = "0.22"
getrandom = "0.3"
futures-core = "0.3"
form_urlencoded = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
